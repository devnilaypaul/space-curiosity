<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astronauts — Space Curiosity</title>
  <meta name="description" content="Astronaut profiles across agencies and eras.">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/icons.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="wrap nav">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span> Space Curiosity</a>
    <button class="menu-btn" aria-expanded="false" aria-controls="navlinks">Menu</button>
    <nav class="nav-links" id="navlinks" aria-label="Primary"><a href="index.html">Home</a><a href="launches.html">Launches</a><a href="astronauts.html">Astronauts</a><a href="rockets.html">Rockets</a><a href="solar-system.html">Solar System</a><a href="discoveries.html">Discoveries</a></nav>
  </div></header>
  <main id="main" class="wrap">
    <section class="hero"><h1>Astronauts</h1><p class="lead">People behind the missions. Search, filter by agency or status, open a card for missions.</p></section>
    <div class="toolbar" role="search">
      <input type="search" id="q" placeholder="Search name or mission" aria-label="Search astronauts">
      <select id="agency" aria-label="Filter by agency"><option value="">All agencies</option></select>
      <select id="status" aria-label="Filter by status"><option value="">Any status</option><option>Active</option><option>Retired</option><option>Deceased</option></select>
      <select id="fav" aria-label="Filter favorites"><option value="">All</option><option value="only">Saved only</option></select>
    </div>
    <div class="result-count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="site-footer"><div class="wrap"><div>Space Curiosity. Data from local JSON, editable in data folder.</div><div>© <span id="year"></span> Space Curiosity</div></div></footer>
  <script type="module">
    import { initChrome } from "./js/main.js";
    import { initStarfield } from "./js/starfield.js";
    import { loadJSON, observeReveals, bindFavorites, favButton, openDialog, syncFiltersToURL, readFiltersFromURL, esc } from "./js/ui.js";
    import { isFavorite } from "./js/store.js";
    initChrome(); initStarfield();
    const saved = readFiltersFromURL(["q", "agency", "status"]);
    const q = document.getElementById("q");
    const agency = document.getElementById("agency");
    const status = document.getElementById("status");
    const fav = document.getElementById("fav");
    q.value = saved.q; agency.value = saved.agency; status.value = saved.status;
    const data = await loadJSON("data/astronauts.json");
    const rows0 = data.astronauts;
    [...new Set(rows0.map((a) => a.agency))].sort().forEach((v) => {
      const o = document.createElement("option"); o.value = v; o.textContent = v;
      if (saved.agency === v) o.selected = true;
      agency.appendChild(o);
    });
    function detail(a) {
      return `${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : ""}<div class="meta"><span class="tag">${esc(a.agency)}</span><span class="tag">${esc(a.status)}</span><span class="tag">First flight ${esc(a.firstFlight)}</span></div><h3>${esc(a.name)}</h3><p>${esc(a.bio)}</p><table class="spec-table"><tr><th>Missions</th><td>${a.missions.map(esc).join(", ")}</td></tr></table>`;
    }
    function render() {
      const query = q.value.trim().toLowerCase();
      syncFiltersToURL({ q: q.value.trim(), agency: agency.value, status: status.value });
      const rows = rows0.filter((a) => {
        if (agency.value && a.agency !== agency.value) return false;
        if (status.value && a.status !== status.value) return false;
        if (fav.value === "only" && !isFavorite(a.id)) return false;
        if (query && ![a.name, a.bio, a.missions.join(" ")].join(" ").toLowerCase().includes(query)) return false;
        return true;
      });
      document.getElementById("count").textContent = `${rows.length} of ${rows0.length} astronauts shown.`;
      const grid = document.getElementById("grid");
      grid.innerHTML = rows.map((a) => `
        <article class="card reveal visible">
          ${a.image ? `<img src="${esc(a.image)}" alt="${esc(a.name)}" loading="lazy">` : ""}
          <div class="card-body">
            <div class="meta"><span class="tag">${esc(a.agency)}</span><span class="tag">${esc(a.status)}</span></div>
            <h3>${esc(a.name)}</h3>
            <p class="desc">${esc(a.bio)}</p>
            <div class="card-actions"><button class="btn btn-small" data-id="${esc(a.id)}">Details</button>${favButton(a.id)}</div>
          </div>
        </article>`).join("") || `<div class="empty">No astronauts match those filters.</div>`;
      bindFavorites(grid);
    }
    document.getElementById("grid").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      const a = rows0.find((x) => x.id === b.getAttribute("data-id"));
      if (a) openDialog(detail(a));
    });
    [q, agency, status, fav].forEach((el) => el.addEventListener("input", render));
    render(); observeReveals(document);
  </script>
</body>
</html>
