<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System — Space Curiosity</title>
  <meta name="description" content="Star, planets, dwarf worlds, and notable exoplanets.">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/icons.svg" type="image/svg+xml">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="wrap nav">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span> Space Curiosity</a>
    <button class="menu-btn" aria-expanded="false" aria-controls="navlinks">Menu</button>
    <nav class="nav-links" id="navlinks" aria-label="Primary"><a href="index.html">Home</a><a href="launches.html">Launches</a><a href="astronauts.html">Astronauts</a><a href="rockets.html">Rockets</a><a href="solar-system.html">Solar System</a><a href="discoveries.html">Discoveries</a></nav>
  </div></header>
  <main id="main" class="wrap">
    <section class="hero"><h1>Solar system and beyond</h1><p class="lead">Our star, its planets, plus one standout exoplanet system to show how common worlds are.</p></section>
    <div class="toolbar" role="search">
      <input type="search" id="q" placeholder="Search worlds" aria-label="Search worlds">
      <select id="type" aria-label="Filter by type"><option value="">All types</option></select>
    </div>
    <div class="result-count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="site-footer"><div class="wrap"><div>Space Curiosity. Distances in AU where known.</div><div>© <span id="year"></span> Space Curiosity</div></div></footer>
  <script type="module">
    import { initChrome } from "./js/main.js";
    import { initStarfield } from "./js/starfield.js";
    import { loadJSON, bindFavorites, favButton, openDialog, esc } from "./js/ui.js";
    initChrome(); initStarfield();
    const q = document.getElementById("q");
    const type = document.getElementById("type");
    const data = await loadJSON("data/planets.json");
    const rows0 = data.bodies;
    [...new Set(rows0.map((b) => b.type))].forEach((v) => {
      const o = document.createElement("option"); o.value = v; o.textContent = v; type.appendChild(o);
    });
    function render() {
      const query = q.value.trim().toLowerCase();
      const rows = rows0.filter((b) => {
        if (type.value && b.type !== type.value) return false;
        if (query && [b.name, b.summary, b.type].join(" ").toLowerCase().includes(query)) return true;
        return !query;
      });
      document.getElementById("count").textContent = `${rows.length} worlds shown.`;
      const grid = document.getElementById("grid");
      grid.innerHTML = rows.map((b) => `
        <article class="card">
          ${b.image ? `<img src="${esc(b.image)}" alt="${esc(b.name)}" loading="lazy">` : ""}
          <div class="card-body">
            <div class="meta"><span class="tag">${esc(b.type)}</span>${b.distanceAU !== null ? `<span class="tag">${b.distanceAU} AU</span>` : ""}<span class="tag">${b.moons} moons</span></div>
            <h3>${esc(b.name)}</h3>
            <p class="desc">${esc(b.summary)}</p>
            <div class="card-actions"><button class="btn btn-small" data-id="${esc(b.id)}">Facts</button>${favButton(b.id)}</div>
          </div>
        </article>`).join("");
      bindFavorites(grid);
    }
    document.getElementById("grid").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      const v = rows0.find((x) => x.id === b.getAttribute("data-id"));
      if (v) openDialog(`${v.image ? `<img src="${esc(v.image)}" alt="" loading="lazy">` : ""}<div class="meta"><span class="tag">${esc(v.type)}</span></div><h3>${esc(v.name)}</h3><table class="spec-table"><tr><th>Day</th><td>${esc(v.dayLength)}</td></tr><tr><th>Year</th><td>${esc(v.yearLength)}</td></tr><tr><th>Moons</th><td>${v.moons}</td></tr></table><p>${esc(v.summary)}</p>`);
    });
    [q, type].forEach((el) => el.addEventListener("input", render));
    render();
  </script>
</body>
</html>
